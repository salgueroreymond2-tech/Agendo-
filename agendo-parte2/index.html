    const icon = (name) => {
      const paths = {
        menu: '<path d="M4 7h16M4 12h16M4 17h16"/>', close: '<path d="m6 6 12 12M18 6 6 18"/>', home: '<path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-6h6v6"/>', calendar: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', services: '<path d="M4 6h16M4 12h16M4 18h10"/><path d="M17 16v4M15 18h4"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', chart: '<path d="M4 19V5M4 19h16"/><path d="m7 15 3-4 3 2 5-6"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>', moon: '<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.8 6.8 0 0 0 21 12.8Z"/>', arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>'

      return `<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.home}</svg>`;
    };
    const currentTheme = () => document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';

    const appFooter = () => `<footer class="app-footer"><span class="app-footer-brand">AGENDO</span><span>Reservas y organización para negocios de servicios.</span><small>© ${new Date().getFullYear()} AGENDO · Entorno local</small></footer>`;

    function calculateScenario() { const s = CASE.segments, p = CASE.paymentRates; const baseline = (s.noSetup*p.noSetup+s.configuredNoBooking*p.configuredNoBooking+s.bookingNoHabit*p.bookingNoHabit+s.habitual*p.habitual) / 100; const target = (s.noSetup*p.noSetup+(s.configuredNoBooking-8)*p.configuredNoBooking+(s.bookingNoHabit+8)*p.bookingNoHabit+s.habitual*p.habitual) / 100; const paid = CASE.baseline.trials*target; const cac = (10000+1200+20*paid)/paid; return { baseline, target, paid, cac }; }

    function selfChecks() { const scenario = calculateScenario(); const segmentsTotal = Object.values(CASE.segments).reduce((a,b)=>a+b,0); return [ ['Segmentos conservan 100 trials', segmentsTotal === 100], ['Conversión implícita ≈ 14 %', Math.abs(scenario.baseline - .1388) < .000001], ['Meta conserva los trials', Math.abs(scenario.target - .1468) < .000001], ['CAC del escenario usa comisión variable', Math.abs(scenario.cac - 172.588555858311) < .0001] ]; }
    function renderWelcome() { return `<section id="contenido" class="card welcome" aria-labelledby="title"><div class="welcome-grid"><div class="hero-copy"><div class="hero-kicker"><span class="eyebrow">Prueba gratis · 14 días</span><span class="hero-status"><span aria-hidden="true"></span>Configuración guiada</span></div><h1 id="title">Convierte tus horarios en reservas.</h1><p class="lede">Crea una página de reservas clara para tu barbería, comparte tu enlace y organiza tu agenda desde un solo lugar.</p><label class="field hero-field"><span>¿Cómo se llama tu negocio?</span><input data-field="businessName" value="${escapeHtml(state.businessName)}" autocomplete="organization" placeholder="Ejemplo: Barbería Central"><small class="tiny">Usaremos este nombre para preparar tu página de reservas.</small></label>${error()}<div class="actions hero-actions"><button class="btn primary" data-action="start">Configurar mi página <span aria-hidden="true">→</span></button><span class="hero-proof">Sin datos fiscales al iniciar</span></div></div><aside class="hero-side" aria-label="Lo que puedes configurar con AGENDO"><span class="sim">PRODUCTO AGENDO</span><h2>Una experiencia de reserva que se entiende al instante.</h2><div class="hero-preview" aria-hidden="true"><div class="preview-topline"><span></span><span></span><span></span></div><div class="preview-brand"><b>A</b><span>${safeBusiness()}</span></div><div class="preview-slot"><span>Servicio</span><strong>Corte · 30 min</strong></div><div class="preview-slot"><span>Disponibilidad</span><strong>Hoy · 10:00 a. m.</strong></div><div class="preview-cta">Reservar cita</div></div><ul class="value-list"><li><span class="dot"></span>Servicios claros y editables</li><li><span class="dot"></span>Horario semanal sencillo</li><li><span class="dot"></span>Un enlace listo para compartir</li></ul></aside></div></section>`; }
    function renderServices() { const cards = state.services.map((service,index) => `<article class="service-card"><div class="service-top"><strong>Servicio ${index+1}</strong><span class="sim">SIMULADO</span><button class="btn danger small" data-action="remove-service" data-index="${index}" aria-label="Eliminar servicio ${index+1}">Quitar</button></div><div class="service-fields"><label>Nombre<input data-service-index="${index}" data-service-key="name" value="${escapeHtml(service.name)}"></label><label>Precio USD<input type="number" min="0" step="1" data-service-index="${index}" data-service-key="price" value="${escapeHtml(service.price)}"></label><label>Duración min<input type="number" min="5" step="5" data-service-index="${index}" data-service-key="duration" value="${escapeHtml(service.duration)}"></label></div></article>`).join(''); return `<section id="contenido" class="card main-card" aria-labelledby="services-title">${progress(1)}<span class="eyebrow">Paso funcional</span><h2 id="services-title">Elige tus servicios</h2><p class="muted">Partimos de opciones habituales para que publiques rápido. Puedes editarlas; precios y duraciones iniciales son datos simulados.</p><div class="services">${cards}</div><div class="actions"><button class="btn secondary" data-action="add-service">+ Agregar servicio</button><div class="action-right"><button class="btn ghost" data-action="back-welcome">Atrás</button><button class="btn primary" data-action="services-next">Continuar</button></div></div>${error()}</section>`; }
    function renderSchedule() { const days = dayNames.map(day => `<button class="day ${state.selectedDays.includes(day)?'selected':''}" data-action="toggle-day" data-day="${day}" aria-pressed="${state.selectedDays.includes(day)}">${day}</button>`).join(''); const rows = dayNames.map(day => { const item=state.schedule[day]; return `<div class="schedule-row"><strong>${day}</strong><span class="${item.active?'status-open':'status-closed'}">${item.active ? `${item.start} – ${item.end}` : 'Cerrado'}</span></div>`; }).join(''); return `<section id="contenido" class="card main-card" aria-labelledby="schedule-title">${progress(2)}<span class="eyebrow">Paso funcional</span><h2 id="schedule-title">Define tu horario</h2><p class="muted">Selecciona días y aplica una plantilla. El horario inicial está identificado como simulado.</p><div class="day-tools"><div><strong>Días a editar</strong><div class="days" role="group" aria-label="Días seleccionados">${days}</div></div><div><span class="sim">HORARIO SIMULADO</span><div class="input-row"><label class="field"><span>Apertura</span><input type="time" data-field="templateStart" value="${state.templateStart}"></label><label class="field"><span>Cierre</span><input type="time" data-field="templateEnd" value="${state.templateEnd}"></label><button class="btn secondary" data-action="apply-hours">Aplicar</button></div></div></div><div class="schedule-preview"><strong>Así verá el cliente tu disponibilidad</strong>${rows}</div><div class="actions"><button class="btn ghost" data-action="back-services">Atrás</button><button class="btn primary" data-action="schedule-next">Publicar mi página</button></div>${error()}</section>`; }
    function servicesPreview() { return state.services.map(service => `<div class="preview-service"><span><strong>${escapeHtml(service.name)}</strong><br><small>${escapeHtml(service.duration)} min <span class="sim">SIMULADO</span></small></span><strong>${money(service.price)}</strong></div>`).join(''); }
    function renderPublish() { const message = `Reserva tu cita en ${state.businessName.trim() || 'mi barbería'}: ${localLink()}`; const wa = `https://wa.me/?text=${encodeURIComponent(message)}`; return `<section id="contenido" class="card main-card wide" aria-labelledby="publish-title">${progress(3)}<span class="eyebrow">Página preparada</span><h2 id="publish-title">Tu enlace ya está listo para compartir</h2><p class="muted">La demostración presenta una página local. No es una URL pública y no se puede abrir desde otro dispositivo.</p><div class="publication"><article class="preview-page"><div class="preview-head"><span class="sim">VISTA PREVIA SIMULADA</span><h3>${safeBusiness()}</h3><p>Reserva tu espacio en pocos segundos.</p></div><div class="preview-services">${servicesPreview()}</div></article><aside class="share-grid"><div class="share-card"><strong>Enlace de demostración</strong><p class="local-url">${escapeHtml(localLink())}</p><button class="btn secondary small" data-action="copy-link">Copiar enlace</button></div><div class="share-card"><strong>Compartir por WhatsApp</strong><p class="muted">Se abrirá la función de compartir de tu dispositivo con un mensaje preparado.</p><a class="btn primary" href="${wa}" target="_blank" rel="noopener">Compartir por WhatsApp</a></div><div class="share-card"><strong>Usar en Instagram</strong><p class="muted">Copia el texto y el enlace, luego pégalos manualmente en tu perfil o historia. No existe integración automática en este prototipo.</p><button class="btn ghost small" data-action="copy-message">Copiar texto para Instagram</button></div></aside></div>${state.notice?`<p class="notice" role="status">${escapeHtml(state.notice)}</p>`:''}<div class="actions"><button class="btn ghost" data-action="back-schedule">Atrás</button><div class="action-right"><button class="btn secondary" data-action="open-booking">Ver página de reservas</button><button class="btn primary" data-action="simulate-reservation">Mostrar primera reserva</button></div></div></section>`; }
    function renderBooking() { const openDays = dayNames.filter(day=>state.schedule[day].active).map(day=>`${day}: ${state.schedule[day].start}–${state.schedule[day].end}`).join(' · '); return `<section id="contenido" class="card main-card wide" aria-labelledby="booking-title"><header class="booking-head"><div><span class="sim">PÁGINA DE RESERVAS SIMULADA</span><h2 id="booking-title">${safeBusiness()}</h2><p>Agenda tu próximo servicio.</p></div><button class="btn ghost" style="color:white;border-color:#aebcf2" data-action="back-publish">Administrar página</button></header><div class="booking-main"><div class="booking-layout"><div><h3>Servicios disponibles</h3><div class="preview-services">${servicesPreview()}</div></div><aside class="booking-summary"><h3>Horario</h3><p class="muted">${escapeHtml(openDays || 'Aún no hay horario publicado.')}</p><span class="sim">HORARIO SIMULADO</span></aside></div><button class="btn primary" data-action="simulate-reservation">Reservar una cita de demostración</button><p class="muted">Esta acción no crea una cita real ni envía notificaciones.</p><button class="badge" data-action="home">Reservado con AGENDO · Conoce AGENDO para tu barbería</button></div></section>`; }
    function renderSuccess() { return `<section id="contenido" class="card main-card" aria-labelledby="success-title"><div class="reservation"><span class="sim">RESERVA SIMULADA</span><h2 id="success-title">¡Tu primera reserva llegó!</h2><p>Este es el momento AHA: el negocio ve que su página puede convertirse en una cita.</p><div class="reservation-data"><strong>Cliente: Ana Martínez <span class="sim">SIMULADO</span></strong><span>Servicio: ${escapeHtml(state.services[0]?.name || 'Corte')} · ${escapeHtml(state.services[0]?.duration || 30)} min</span><span>Hoy, 10:00 a. m. <span class="sim">SIMULADO</span></span></div><p class="muted">La reserva fue generada dentro del prototipo; no proviene de un cliente real.</p></div><div class="actions"><button class="btn secondary" data-action="open-booking">Ver mi página</button><button class="btn primary" data-action="open-panel">Ver impacto en el panel</button></div></section>`; }
    function renderPanel() { const scenario=calculateScenario(), funnel=funnelRows(), checks=selfChecks(); const rows=funnel.map(row=>`<tr><td>${row.label}</td><td>${row.arrived}</td><td>${row.completed}</td><td>${(row.conversion*100).toFixed(1)} %</td><td>${row.drop}</td><td><span class="tag-case">DEL CASO</span></td></tr>`).join(''); const localEvent=state.simulatedReservation?'<span class="tag-demo">1 RESERVA LOCAL SIMULADA</span>':'<span class="tag-demo">SIN EVENTOS LOCALES</span>'; return `<section id="contenido" class="dashboard" aria-labelledby="panel-title"><div class="dash-head"><div><span class="eyebrow">Vista interna · demostración</span><h1 id="panel-title" style="font-size:2.2rem">Panel de Valeria</h1><p class="lede">Separa datos del caso, metas hipotéticas y eventos generados en este navegador.</p></div><button class="btn ghost" data-action="home">Volver al recorrido</button></div><div class="kpis"><article class="card kpi"><small>Trials mensuales</small><strong>500</strong><span class="tag-case">DEL CASO</span></article><article class="card kpi"><small>Setup completo</small><strong>62 %</strong><span class="tag-case">DEL CASO</span></article><article class="card kpi"><small>Primera reserva*</small><strong>61,3 %</strong><span class="tag-case">DEL CASO</span></article><article class="card kpi"><small>Meta de escenario*</small><strong>74,2 %</strong><span class="tag-goal">META HIPOTÉTICA</span></article></div><div class="dash-grid"><article class="card section"><h2>Embudo histórico</h2><p class="muted">*Primera reserva: 38 de 62 negocios configurados; no demuestra causalidad por compartir.</p><div class="table-wrap"><table><thead><tr><th>Paso</th><th>Llegan</th><th>Completan</th><th>Conversión</th><th>Abandono</th><th>Fuente</th></tr></thead><tbody>${rows}</tbody></table></div></article><aside class="card section"><h2>Escenario financiero</h2><p><strong>Conversión actual:</strong> 14,0 % <span class="tag-case">DEL CASO</span></p><p><strong>Conversión por segmentos:</strong> ${(scenario.baseline*100).toFixed(2)} %</p><p><strong>Escenario de activación:</strong> ${(scenario.target*100).toFixed(2)} % <span class="tag-goal">META</span></p><p><strong>CAC paid:</strong> ${money(CASE.baseline.cacPaid)} → ${money(scenario.cac)}</p><p class="muted">Se mantienen 500 trials, USD 10.000 de pauta, una vendedora y USD 20 de comisión por cliente. Es un cálculo condicionado, no un resultado probado.</p></aside></div><div class="dash-grid"><article class="card section"><h2>Ciclo de crecimiento</h2><div class="loop"><span>Barbería activa</span><span>↓ Página de reservas · 250 visitas/mes <span class="tag-case">DEL CASO</span></span><span>↓ Insignia de AGENDO · 8 registros/mes <span class="tag-case">DEL CASO</span></span><span>↓ Prueba gratuita → activación → nueva barbería activa</span></div><p class="muted">No hay denominador suficiente para calcular una tasa de referidos ni conversiones pagas atribuibles a la insignia.</p></article><aside class="card section"><h2>Validaciones locales</h2><div class="checks">${checks.map(([label,pass])=>`<div class="check"><span>${label}</span><b>${pass?'SUPERADA':'FALLIDA'}</b></div>`).join('')}</div><p style="margin-top:1rem">Evento actual: ${localEvent}</p></aside></div></section>`; }
    function render() { const content = state.screen==='welcome'?renderWelcome():state.screen==='services'?renderServices():state.screen==='schedule'?renderSchedule():state.screen==='publish'?renderPublish():state.screen==='booking'?renderBooking():state.screen==='success'?renderSuccess():renderPanel(); const onboarding = onboardingScreens.has(state.screen) ? 'is-onboarding' : ''; app.innerHTML = `<div class="app-layout ${onboarding}">${sidebar()}<div class="app-workspace">${header()}<div class="app-content">${content}</div>${appFooter()}</div></div>`; }
    function validServices() { return state.services.length>0 && state.services.every(s=>String(s.name).trim() && Number(s.price)>0 && Number(s.duration)>0); }
    function setScreen(screen) { state.screen=screen; state.notice=''; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    async function copyText(text, success) { try { if (!navigator.clipboard) throw new Error('clipboard unavailable'); await navigator.clipboard.writeText(text); state.notice=success; } catch { state.notice=`No se pudo copiar automáticamente. Selecciona y copia este texto: ${text}`; } render(); }
    app.addEventListener('input', event => { const target=event.target; if (target.dataset.field) { state[target.dataset.field]=target.value; } if (target.dataset.serviceIndex !== undefined) { const service=state.services[Number(target.dataset.serviceIndex)]; const key=target.dataset.serviceKey; service[key]=key==='name'?target.value:Number(target.value); } });
    app.addEventListener('click', event => { const button=event.target.closest('[data-action]'); if (!button) return; const action=button.dataset.action; if(action==='toggle-theme') return toggleTheme(button); if(action==='toggle-menu') { state.menuOpen=!state.menuOpen; return render(); } if(action==='close-menu') { state.menuOpen=false; return render(); } if(action.startsWith('nav-')) return navigate(action.slice(4)); state.error=''; if(action==='home') return setScreen('welcome'); if(action==='open-panel') return setScreen('panel'); if(action==='open-booking') return setScreen('booking'); if(action==='back-welcome') return setScreen('welcome'); if(action==='back-services') return setScreen('services'); if(action==='back-schedule') return setScreen('schedule'); if(action==='back-publish') return setScreen('publish'); if(action==='start') { if(!state.businessName.trim()) { state.error='Escribe el nombre de tu negocio para continuar.'; return render(); } return setScreen('services'); } if(action==='add-service') { state.services.push({name:'Nuevo servicio',price:10,duration:30}); return render(); } if(action==='remove-service') { if(state.services.length===1){ state.error='Necesitas al menos un servicio para publicar.'; return render(); } state.services.splice(Number(button.dataset.index),1); return render(); } if(action==='services-next') { if(!validServices()){ state.error='Completa nombre, precio y duración de al menos un servicio.'; return render(); } return setScreen('schedule'); } if(action==='toggle-day') { const day=button.dataset.day; state.selectedDays=state.selectedDays.includes(day)?state.selectedDays.filter(item=>item!==day):[...state.selectedDays,day]; return render(); } if(action==='apply-hours') { if(!state.selectedDays.length){ state.error='Selecciona al menos un día para aplicar el horario.'; return render(); } if(state.templateStart>=state.templateEnd){ state.error='La hora de apertura debe ser anterior al cierre.'; return render(); } state.selectedDays.forEach(day=>state.schedule[day]={active:true,start:state.templateStart,end:state.templateEnd}); return render(); } if(action==='schedule-next') { if(!Object.values(state.schedule).some(item=>item.active)){ state.error='Publica al menos un día y horario disponible.'; return render(); } return setScreen('publish'); } if(action==='copy-link') return copyText(localLink(),'Enlace de demostración copiado. Recuerda: solo funciona como representación local.'); if(action==='copy-message') return copyText(`Reserva tu cita en ${state.businessName}: ${localLink()}`,'Texto preparado para Instagram copiado. Debes pegarlo manualmente.'); if(action==='simulate-reservation') { state.simulatedReservation=true; return setScreen('success'); } });
    window.AgendoPrototype = { state, render, setScreen };
    render();
  </script>
  <script>
    'use strict';
    (() => {
      const prototype = window.AgendoPrototype;
      const app = document.getElementById('app');
      if (!prototype || !app) return;
      const state = prototype.state;
      const apiBase = window.location.protocol === 'file:' ? 'http://localhost:3000/api/v1' : '/api/v1';
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
      const isPublicRoute = () => /^\/reservas\/[^/]+$/.test(window.location.pathname);
      const api = async (path, options = {}) => {
        const response = await fetch(`${apiBase}${path}`, { credentials: 'include', headers: { ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...(options.headers ?? {}) }, ...options });
        if (response.status === 204) return null;
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error?.message || 'No fue posible completar la operación.');
        return payload.data;
      };
      const showError = (message) => { state.error = message; prototype.render(); };
      const showNotice = (message) => { state.notice = message; prototype.render(); };

      function addAccessFields() {
        if (isPublicRoute() || document.getElementById('owner-access-fields')) return;
        const anchor = app.querySelector('.welcome .field');
        if (!anchor) return;
        const panel = document.createElement('section');
        panel.id = 'owner-access-fields';
        panel.className = 'service-card';
        panel.innerHTML = `<div class="service-top"><strong>Acceso del propietario</strong><span class="pill">Datos reales</span></div>
          <p class="muted">Crea una cuenta para guardar tu configuración. No se solicitan datos fiscales durante este paso.</p>
          <div class="service-fields"><label>Nombre<input data-field="ownerFirstName" autocomplete="given-name" value="${escapeHtml(state.ownerFirstName)}"></label><label>Apellido<input data-field="ownerLastName" autocomplete="family-name" value="${escapeHtml(state.ownerLastName)}"></label><label>Correo<input data-field="ownerEmail" type="email" autocomplete="email" value="${escapeHtml(state.ownerEmail)}"></label></div>
          <label class="field"><span>Contraseña</span><input data-field="ownerPassword" type="password" autocomplete="new-password" minlength="12"><small class="tiny">Mínimo 12 caracteres. Se guarda únicamente su hash seguro.</small></label>
          <button class="btn ghost small" data-api-action="login">Ya tengo una cuenta: iniciar sesión</button>`;
        anchor.insertAdjacentElement('afterend', panel);
      }

      function enhanceScreen() {
        addAccessFields();
        const publishDescription = document.querySelector('#publish-title + p.muted');
        if (state.business?.slug && publishDescription) publishDescription.textContent = 'Tu página está publicada. Este enlace usa el servidor actual y puede compartirse con clientes.';
      }
      const observer = new MutationObserver(enhanceScreen);
      observer.observe(app, { childList: true, subtree: true });

      function identityInput() {
        return {
          firstName: state.ownerFirstName?.trim(), lastName: state.ownerLastName?.trim(),
          email: state.ownerEmail?.trim(), password: state.ownerPassword
        };
      }
      async function authenticate(mode) {
        const identity = identityInput();
        if (!identity.email || !identity.password || (mode === 'register' && (!identity.firstName || !identity.lastName))) throw new Error(mode === 'register' ? 'Completa tu nombre, apellido, correo y contraseña para crear la cuenta.' : 'Completa correo y contraseña para iniciar sesión.');
        const body = mode === 'register' ? identity : { email: identity.email, password: identity.password };
        const result = await api(`/auth/${mode}`, { method: 'POST', body: JSON.stringify(body) });
        state.user = result.user;
      }
      async function createBusinessIfNeeded() {
        if (state.business) return state.business;
        if (!state.businessName?.trim()) throw new Error('Escribe el nombre de tu negocio para continuar.');
        const result = await api('/businesses', { method: 'POST', body: JSON.stringify({ name: state.businessName.trim(), timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Costa_Rica' }) });
        state.business = result.business;
        await api('/onboarding/events', { method: 'POST', body: JSON.stringify({ businessId: state.business.id, eventName: 'onboarding_started' }) });
        return state.business;
      }
      async function beginRealOnboarding(mode) {
        try {
          if (!state.user) await authenticate(mode);
          await createBusinessIfNeeded();
          state.error = ''; prototype.setScreen('services');
        } catch (error) { showError(error.message); }
      }
      async function persistServices() {
        const business = await createBusinessIfNeeded();
        if (!state.services?.length || state.services.some((service) => !String(service.name).trim() || Number(service.price) <= 0 || Number(service.duration) <= 0)) throw new Error('Completa nombre, precio y duración de al menos un servicio.');
        for (let index = 0; index < state.services.length; index += 1) {
          const service = state.services[index];
          const payload = { name: String(service.name).trim(), price: Number(service.price), durationMinutes: Number(service.duration) };
          const result = service.id ? await api(`/services/${service.id}`, { method: 'PATCH', body: JSON.stringify(payload) }) : await api(`/businesses/${business.id}/services`, { method: 'POST', body: JSON.stringify(payload) });
          state.services[index] = { ...service, ...result.service, duration: result.service.durationMinutes };
        }
        state.error = ''; prototype.setScreen('schedule');
      }
      async function persistScheduleAndPublish() {
        try {
          const business = await createBusinessIfNeeded();
          const dayMap = { Dom: 0, Lun: 1, Mar: 2, 'Mié': 3, Jue: 4, Vie: 5, Sáb: 6 };
          const hours = Object.entries(state.schedule).map(([day, value]) => ({ dayOfWeek: dayMap[day], isClosed: !value.active, ...(value.active ? { openingTime: value.start, closingTime: value.end } : {}) }));
          await api(`/businesses/${business.id}/hours`, { method: 'PUT', body: JSON.stringify({ hours }) });
          const published = await api(`/businesses/${business.id}/publish`, { method: 'POST' });
          state.business = published.business;
          state.error = ''; prototype.setScreen('publish');
        } catch (error) { showError(error.message); }
      }
      function captureAction(event) {
        const target = event.target.closest('[data-api-action], [data-action]');
        if (!target || isPublicRoute()) return;
        const apiAction = target.dataset.apiAction;
        const action = target.dataset.action;
        if (apiAction === 'login') { event.preventDefault(); event.stopImmediatePropagation(); void beginRealOnboarding('login'); return; }
        if (action === 'start') { event.preventDefault(); event.stopImmediatePropagation(); void beginRealOnboarding('register'); return; }
        if (action === 'services-next' && state.business) { event.preventDefault(); event.stopImmediatePropagation(); void persistServices().catch((error) => showError(error.message)); return; }
        if (action === 'schedule-next' && state.business) { event.preventDefault(); event.stopImmediatePropagation(); void persistScheduleAndPublish(); return; }
        if (action === 'open-booking' && state.business?.slug) { event.preventDefault(); event.stopImmediatePropagation(); window.location.assign(`/reservas/${encodeURIComponent(state.business.slug)}`); }
      }
      app.addEventListener('click', captureAction, true);
      app.addEventListener('click', (event) => {
        const share = event.target.closest('a');
        if (share?.textContent?.includes('WhatsApp') && state.business) api('/onboarding/events', { method: 'POST', body: JSON.stringify({ businessId: state.business.id, eventName: 'booking_link_shared', metadata: { channel: 'whatsapp' } }) }).catch(() => {});
      }, true);

      async function renderPublicBooking() {
        const slug = decodeURIComponent(window.location.pathname.split('/').pop());
        try {
          const [servicePayload, availabilityPayload] = await Promise.all([api(`/public/businesses/${encodeURIComponent(slug)}/services`), api(`/public/businesses/${encodeURIComponent(slug)}/availability`)]);
          const business = servicePayload.business;
          const services = servicePayload.services;
          const hours = availabilityPayload.hours.filter((hour) => !hour.isClosed).map((hour) => `Día ${hour.dayOfWeek}: ${hour.openingTime}–${hour.closingTime}`).join(' · ');
          app.innerHTML = `<header class="topbar public-topbar"><div class="brand"><img class="brand-logo" src="/assets/agendo-logo.png" alt="Agendo"></div><span class="pill">Reservas</span></header><section id="contenido" class="card main-card wide"><div class="booking-head"><div><span class="pill">Página pública</span><h2>${escapeHtml(business.name)}</h2><p>${escapeHtml(business.description || 'Agenda tu próxima cita.')}</p></div></div><div class="booking-main"><div class="booking-layout"><div><h3>Servicios disponibles</h3><div class="preview-services">${services.map((service) => `<div class="preview-service"><span><strong>${escapeHtml(service.name)}</strong><br><small>${escapeHtml(service.durationMinutes)} min</small></span><strong>USD ${escapeHtml(service.price)}</strong></div>`).join('')}</div></div><aside class="booking-summary"><h3>Horario</h3><p class="muted">${escapeHtml(hours || 'Consulta disponibilidad con el negocio.')}</p><small>Zona horaria: ${escapeHtml(business.timezone)}</small></aside></div><form id="public-booking-form"><h3>Solicita una reserva</h3><label class="field"><span>Servicio</span><select name="serviceId" required>${services.map((service) => `<option value="${service.id}">${escapeHtml(service.name)} · ${escapeHtml(service.durationMinutes)} min</option>`).join('')}</select></label><label class="field"><span>Nombre</span><input name="customerName" required maxlength="160" autocomplete="name"></label><label class="field"><span>Correo</span><input name="customerEmail" type="email" autocomplete="email"></label><label class="field"><span>Teléfono</span><input name="customerPhone" maxlength="32" autocomplete="tel"></label><label class="field"><span>Fecha y hora</span><input name="appointmentStart" type="datetime-local" step="300" required></label><label class="field"><span>Notas opcionales</span><input name="notes" maxlength="3000"></label><button class="btn primary" type="submit">Solicitar reserva</button><p id="public-booking-message" class="error" role="status"></p></form><button class="badge" type="button" onclick="window.location.href='/'">Reservado con AGENDO · Conoce AGENDO para tu barbería</button></div></section><footer class="public-footer"><div><img class="brand-logo" src="/assets/agendo-logo.png" alt="Agendo"><span><small>Reservas simples para negocios de servicios.</small></span></div><small>© ${new Date().getFullYear()} AGENDO</small></footer>`;
          document.getElementById('public-booking-form').addEventListener('submit', async (event) => {
            event.preventDefault(); const form = new FormData(event.currentTarget); const message = document.getElementById('public-booking-message');
            try { const created = await api(`/public/businesses/${encodeURIComponent(slug)}/bookings`, { method: 'POST', body: JSON.stringify({ serviceId: form.get('serviceId'), customerName: form.get('customerName'), customerEmail: form.get('customerEmail') || undefined, customerPhone: form.get('customerPhone') || undefined, appointmentStart: new Date(form.get('appointmentStart')).toISOString(), notes: form.get('notes') || undefined }) }); message.className = 'notice'; message.textContent = `Reserva registrada con estado ${created.booking.status}. El negocio confirmará la cita.`; event.currentTarget.reset(); } catch (error) { message.className = 'error'; message.textContent = error.message; }
          });
        } catch (error) { app.innerHTML = `<section class="card main-card"><h2>Página no disponible</h2><p class="muted">${escapeHtml(error.message)}</p></section>`; }
      }
      if (isPublicRoute()) void renderPublicBooking(); else enhanceScreen();
    })();
  </script>
</body>
</html>
